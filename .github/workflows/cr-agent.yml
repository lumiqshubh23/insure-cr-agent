name: CR Agent (FRD email -> CR branches in backend + frontend)

on:
  # Instant trigger: Power Automate calls this after saving the FRD mail into the frd-inbox branch
  repository_dispatch:
    types: [frd-mail]
  # Safety net: check the frd-inbox branch every hour, Mon-Sat 08:30-21:30 IST
  schedule:
    - cron: "0 3-16 * * 1-6"
  # Manual run from the Actions tab
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list CRs and what would happen"
        type: boolean
        default: true
      only_cr:
        description: "Comma-separated CR ids to process (blank = all)"
        type: string
        default: ""

concurrency:
  group: cr-agent
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out the agent repo (holds frd-inbox)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ---- Toolchains so Claude can build and test both repos. Adjust versions to match your projects.
      # TODO: add anything else your builds need (private Maven/npm registry credentials, Angular CLI, etc.)

      - name: Install agent tools
        run: |
          sudo apt-get update -y && sudo apt-get install -y pandoc
          pip install -r tools/cr-agent/requirements.txt
          npm install -g @anthropic-ai/claude-code

      - name: Run CR agent
        env:
          # Claude access: set ONE of these two secrets.
          #   CLAUDE_CODE_OAUTH_TOKEN = your Claude Team seat (create with `claude setup-token`)
          #   ANTHROPIC_API_KEY       = pay-per-use Console API key
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Token that can push to the backend and frontend repos (Contents: Read and write)
          GH_TOKEN: ${{ secrets.CR_AGENT_GH_TOKEN }}
          # Product repos: name=owner/repo@base-branch, comma-separated
          REPOS: ${{ vars.CR_AGENT_REPOS }}
          TEST_COMMAND_BACKEND: ${{ vars.CR_AGENT_TEST_BACKEND }}
          TEST_COMMAND_FRONTEND: ${{ vars.CR_AGENT_TEST_FRONTEND }}
          SENDER_FILTER: ${{ vars.CR_AGENT_SENDERS }}   # empty = any sender; subject must be INSURE 2.0 Phase -2 FRDS
          CLAUDE_MODEL: ${{ vars.CR_AGENT_MODEL }}
          MAIL_SOURCE: git
          INBOX_BRANCH: frd-inbox
          AGENT_REPO_DIR: ${{ github.workspace }}
          WORKSPACE_DIR: ${{ runner.temp }}/workspace
          # Test switches: repo variables also apply to automatic runs
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || vars.CR_AGENT_DRY_RUN || 'false' }}
          ONLY_CR: ${{ inputs.only_cr || vars.CR_AGENT_ONLY_CR }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then unset CLAUDE_CODE_OAUTH_TOKEN; fi
          if [ -z "$ANTHROPIC_API_KEY" ]; then unset ANTHROPIC_API_KEY; fi
          if [ -z "$GH_TOKEN" ]; then echo "::error::Secret CR_AGENT_GH_TOKEN is missing"; exit 1; fi
          if [ -z "$REPOS" ]; then echo "::error::Variable CR_AGENT_REPOS is missing"; exit 1; fi
          python tools/cr-agent/main.py

      - name: Upload Claude logs and plans
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cr-agent-logs
          path: |
            ${{ runner.temp }}/workspace/.cr-agent/**/claude-*.log
            ${{ runner.temp }}/workspace/cr-docs/**
          if-no-files-found: ignore
          retention-days: 14
